<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barecade</title>
    <style>
      body { font-family: sans-serif; margin: 1rem; }
      button { margin: .25rem; }
      #player { width: 100%; height: 70vh; display: none; }
      #error { color: #b00020; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <section id="login">
        <h1>Barecade</h1>
        <form id="login-form">
          <label>Username <input id="username" autocomplete="username" required></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Log in</button>
        </form>
      </section>

      <section id="browser" hidden>
        <p>
          <span id="who"></span>
          <button id="logout" type="button">Log out</button>
        </p>
        <p id="crumbs"></p>
        <div id="entries"></div>
      </section>

      <section id="player">
        <p><button id="close-player" type="button">Back</button></p>
        <div id="game"></div>
      </section>

      <p id="error"></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
